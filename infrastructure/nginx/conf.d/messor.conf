# Messor public server block.
#
# Serves the built React frontend at / and reverse proxies /api/ to the
# backend service. The frontend and API share the same origin, so the browser
# never needs cross-origin requests and no CORS headers are configured.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The upstream hostname is resolved at request time via a variable so
    # `nginx -t` validates in a standalone container and the backend is
    # resolved on the compose network at runtime. The resolver directive in
    # the http context (nginx.conf) makes this work on the compose network.
    set $backend_upstream http://backend:8080;

    # Common proxy settings shared by every /api/ location. These are defined
    # at the server level so they apply to all proxy locations below. Note that
    # proxy_pass itself is NOT inherited by nested locations, so each proxy
    # location declares its own explicit proxy_pass.
    proxy_http_version 1.1;

    # Only the required proxy headers are forwarded. X-Forwarded-For is set to
    # the direct connection peer ($remote_addr) only, never to
    # $proxy_add_x_forwarded_for, so a client-supplied X-Forwarded-For chain is
    # discarded and cannot be spoofed toward the backend. X-Forwarded-Proto is
    # taken from the connection scheme. No wildcard CORS is enabled.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Login endpoint: strict per-IP rate limit with a small burst. Exact match
    # so it is proxied to the backend with its own rate limit.
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass $backend_upstream$request_uri;
    }

    # Reverse proxy for the rest of the backend API.
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
    }

    # Explicit 429 behavior: return a consistent problem-details body with the
    # standard application/problem+json media type.
    limit_req_status 429;
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests. Please slow down and try again later.","code":"RATE_LIMITED"}';
    }
}
