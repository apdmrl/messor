# Messor production Nginx configuration.
#
# This is the public gateway. It serves the built React frontend and reverse
# proxies /api/ to the backend. TLS is terminated at the deployment edge (a
# load balancer or TLS proxy in front of this container), so this server block
# listens on plain HTTP. The __Host-MESSOR_SESSION cookie requires HTTPS, which
# is why the edge must terminate TLS before requests reach the browser.

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide the Nginx version from error pages and the Server header.
    server_tokens off;

    # Docker's embedded DNS resolver. The /api/ location uses a variable in
    # proxy_pass so that `nginx -t` validates in a standalone container while
    # the backend hostname is resolved on the compose network at runtime. A
    # variable proxy_pass requires an explicit resolver; without it Nginx fails
    # with "no resolver defined to resolve backend" and returns 502.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Minimal log format. It deliberately omits cookies, Authorization headers
    # and request bodies so no session or CSRF values are ever written to logs.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # IP-based rate limit zone. Defined in the http context so it can be
    # referenced by the server/location blocks in conf.d. Login is the primary
    # brute-force target, so it gets a strict per-IP limit with a small burst.
    #
    # The zone keys on $binary_remote_addr, the direct connection peer. When
    # this Nginx instance is the edge (the default compose topology) that is
    # the real client IP. When TLS is terminated at a proxy or load balancer
    # in front of it, $binary_remote_addr becomes that proxy's address for
    # every client, so the limit is shared across all of them instead of being
    # per-client. To make rate limiting per-client behind a trusted edge, only
    # trust a verified proxy network — never an arbitrary client-supplied
    # header. Uncomment and pin your edge network(s) below:
    #
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    #
    # Leave these disabled unless you run behind a trusted edge. Enabling them
    # with an open/unknown proxy list lets a client spoof its IP and bypass
    # the per-client throttle.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
}
