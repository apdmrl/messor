# Messor production Nginx configuration.
#
# This is the public gateway. It serves the built React frontend and reverse
# proxies /api/ to the backend. TLS is terminated at the deployment edge (a
# load balancer or TLS proxy in front of this container), so this server block
# listens on plain HTTP. The __Host-MESSOR_SESSION cookie requires HTTPS, which
# is why the edge must terminate TLS before requests reach the browser.

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide the Nginx version from error pages and the Server header.
    server_tokens off;

    # Minimal log format. It deliberately omits cookies, Authorization headers
    # and request bodies so no session or CSRF values are ever written to logs.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # IP-based rate limit zones. These are defined in the http context so they
    # can be referenced by the server/location blocks in conf.d.
    #
    # Login is the primary brute-force target, so it gets a strict per-IP
    # limit with a small burst.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # The CSRF endpoint is fetched frequently by the SPA, so it gets a higher
    # per-IP limit with a larger burst.
    limit_req_zone $binary_remote_addr zone=csrf_limit:10m rate=30r/m;

    include /etc/nginx/conf.d/*.conf;
}
