name: messor-dev

# One-command local demo environment.
#
# Starts PostgreSQL, the Spring Boot backend and the Nginx-served frontend.
# The frontend gateway on 127.0.0.1:8088 is the only HTTP/application entry
# point: the browser talks to a single origin that serves the UI and proxies
# /api/ to the backend. PostgreSQL is also bound to the host on
# 127.0.0.1:${MESSOR_DB_PORT:-5432}:5432 for local development convenience, but
# it is not an application entry point. Secrets (DB password and demo password)
# come only from .env; never commit real passwords. This file is separate from
# compose.yaml and does not reuse the production Nginx configuration or its rate
# limits.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MESSOR_DB_NAME:-messor}
      POSTGRES_USER: ${MESSOR_DB_USER:-messor}
      POSTGRES_PASSWORD: ${MESSOR_DB_PASSWORD:?Set MESSOR_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MESSOR_DB_PORT:-5432}:5432"
    volumes:
      - messor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${MESSOR_DB_NAME:-messor}
      SPRING_DATASOURCE_USERNAME: ${MESSOR_DB_USER:-messor}
      SPRING_DATASOURCE_PASSWORD: ${MESSOR_DB_PASSWORD:?Set MESSOR_DB_PASSWORD in .env}
      MESSOR_DEMO_PASSWORD: ${MESSOR_DEMO_PASSWORD:?Set MESSOR_DEMO_PASSWORD in .env}
      # Development cookie: Secure=false so localhost HTTP works. The
      # production profile keeps Secure=true and is never downgraded.
      MESSOR_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published to the host; the frontend gateway is the only entry point.

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${MESSOR_DEV_PORT:-8088}:80"
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/actuator/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  messor-postgres-data:
