name: messor-test

# CI / acceptance-test compose stack.
#
# This is a self-contained test stack with its own project name and volume so
# automated acceptance runs never touch the local dev stack (compose.dev.yaml)
# or the production stack (compose.yaml). It runs the same three services under
# the `demo` profile and exposes the frontend gateway on
# 127.0.0.1:${MESSOR_TEST_PORT:-8089} for the real-stack Playwright acceptance
# suites. Secrets come only from the environment / .env; never commit real
# passwords. In CI the demo password is injected as a throwaway value and is
# never written to logs.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MESSOR_DB_NAME:-messor}
      POSTGRES_USER: ${MESSOR_DB_USER:-messor}
      POSTGRES_PASSWORD: ${MESSOR_DB_PASSWORD:?Set MESSOR_DB_PASSWORD in .env}
    volumes:
      - messor-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${MESSOR_DB_NAME:-messor}
      SPRING_DATASOURCE_USERNAME: ${MESSOR_DB_USER:-messor}
      SPRING_DATASOURCE_PASSWORD: ${MESSOR_DB_PASSWORD:?Set MESSOR_DB_PASSWORD in .env}
      MESSOR_DEMO_PASSWORD: ${MESSOR_DEMO_PASSWORD:?Set MESSOR_DEMO_PASSWORD in .env}
      MESSOR_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${MESSOR_TEST_PORT:-8089}:80"
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/actuator/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  messor-test-postgres-data:
