# Production session cookie contract.
#
# The `__Host-` prefix requires the cookie to be Secure, to have Path=/ and to
# carry no Domain attribute. Browsers reject the cookie unless the application
# is served over HTTPS, so TLS must terminate at the deployment edge (see the
# Nginx gateway in compose.yaml and the README).
#
# Secure is hard-coded to true here on purpose. There is deliberately no
# `${...:false}` fallback: production must never downgrade to an insecure
# cookie. The development profile keeps Secure=false so localhost HTTP works.
server:
  servlet:
    session:
      cookie:
        name: __Host-MESSOR_SESSION
        secure: true
        http-only: true
        same-site: lax
        path: /
