# Messor local demo Nginx configuration.
#
# Serves the built React frontend and reverse proxies /api/ and
# /actuator/health to the backend service. This is a development-only config:
# it deliberately omits the production rate limits and the production
# __Host-MESSOR_SESSION cookie handling. The production Nginx files under
# infrastructure/nginx are not used here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver. The proxy locations use a variable in
    # proxy_pass so the backend hostname is resolved on the compose network at
    # runtime. A variable proxy_pass requires an explicit resolver.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # The backend hostname is resolved on the compose network at runtime.
    set $backend_upstream http://backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for the backend API.
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
    }

    # Expose the backend health endpoint through the same origin so the
    # frontend container healthcheck and browser checks can reach it.
    location = /actuator/health {
        proxy_pass $backend_upstream$request_uri;
    }
}
